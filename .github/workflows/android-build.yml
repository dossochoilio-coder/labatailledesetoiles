name: Build DOSCO APK + AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install deps
        run: npm install

      - name: Install TypeScript
        run: npm install -D typescript

      - name: Install Google Play Billing plugin
        run: |
          set -e
          # Détecter la version majeure de Capacitor installée pour choisir la version
          # correspondante du plugin (@capgo/native-purchases suit la major de Capacitor).
          CAP_VER=$(node -p "try{require('@capacitor/core/package.json').version.split('.')[0]}catch(e){'7'}")
          echo "Capacitor majeur détecté : $CAP_VER"
          # Installation OBLIGATOIRE du vrai plugin de facturation.
          npm install @capgo/native-purchases@^${CAP_VER}.0.0 || npm install @capgo/native-purchases
          echo "✅ Plugin @capgo/native-purchases installé"

      - name: Vérifier la présence du plugin de facturation
        run: |
          if [ -d node_modules/@capgo/native-purchases ]; then
            echo "✅ Plugin @capgo/native-purchases présent"
            cat node_modules/@capgo/native-purchases/package.json | grep '"version"' || true
          else
            echo "❌ ERREUR : le plugin de facturation est absent — le build est arrêté."
            exit 1
          fi

      - name: Install AdMob plugin
        run: |
          set -e
          npm install @capacitor-community/admob@latest
          echo "✅ Plugin @capacitor-community/admob installé"

      - name: Vérifier la présence du plugin AdMob
        run: |
          if [ -d node_modules/@capacitor-community/admob ]; then
            echo "✅ Plugin @capacitor-community/admob présent"
            cat node_modules/@capacitor-community/admob/package.json | grep '"version"' || true
          else
            echo "❌ ERREUR : le plugin AdMob est absent — le build est arrêté."
            exit 1
          fi

      - name: Write capacitor.config.js
        run: |
          cat <<EOF > capacitor.config.js
          module.exports = {
            appId: 'com.dosco.batailledesetoiles',
            appName: 'DOSCO',
            webDir: 'dist',
            server: { androidScheme: 'http' },
            android: { allowMixedContent: true }
          };
          EOF

      - name: Clean old configs
        run: rm -f capacitor.config.ts capacitor.config.json

      - name: Prepare dist
        run: |
          mkdir -p dist
          cp DOSCO_Standalone.html dist/index.html

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          else
            echo "exists"
          fi

      - name: Ajouter les règles ProGuard/R8 personnalisées
        run: |
          PGFILE=android/app/proguard-rules.pro
          if [ -f "$PGFILE" ]; then
            cat <<'EOF' >> "$PGFILE"

          # ============================================
          # Règles DOSCO pour R8
          # ============================================

          # Capacitor core : le pont JS <-> natif fonctionne par réflexion,
          # ces classes ne doivent jamais être supprimées ni renommées.
          -keep class com.getcapacitor.** { *; }
          -keepclassmembers class * extends com.getcapacitor.Plugin {
              @com.getcapacitor.annotation.PluginMethod public *;
          }
          -keep class * extends com.getcapacitor.Plugin
          -keepattributes *Annotation*
          -keepattributes JavascriptInterface

          # Interface JS <-> WebView (@JavascriptInterface)
          -keepclassmembers class * {
              @android.webkit.JavascriptInterface <methods>;
          }

          # Plugin de facturation Google Play (@capgo/native-purchases)
          -keep class com.android.billingclient.** { *; }
          -keep class com.capgo.** { *; }

          # Garde les noms de fichiers/lignes pour des traces de crash lisibles
          -keepattributes SourceFile,LineNumberTable
          -renamesourcefileattribute SourceFile
          EOF
            echo "✅ Règles ProGuard/R8 ajoutées à $PGFILE"
          else
            echo "⚠️ $PGFILE introuvable — R8 utilisera uniquement les règles par défaut de Capacitor"
          fi

      - name: Activer R8 (minifyEnabled + shrinkResources) pour le build release
        run: |
          GRADLE=android/app/build.gradle
          if [ -f "$GRADLE" ]; then
            echo "=== buildTypes.release avant ==="
            grep -A 4 "release {" "$GRADLE" || true
            sed -i 's/minifyEnabled false/minifyEnabled true/' "$GRADLE"
            if ! grep -q "shrinkResources" "$GRADLE"; then
              sed -i '/minifyEnabled true/a\            shrinkResources true' "$GRADLE"
            fi
            echo "=== buildTypes.release après ==="
            grep -A 5 "release {" "$GRADLE" || true
            echo "✅ R8 activé (minification + réduction des ressources)"
          else
            echo "⚠️ build.gradle introuvable"
          fi

      - name: Ajouter la permission BILLING au manifeste
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if [ -f "$MANIFEST" ] && ! grep -q "com.android.vending.BILLING" "$MANIFEST"; then
            sed -i 's#<application#<uses-permission android:name="com.android.vending.BILLING"/>\n\n    <application#' "$MANIFEST"
            echo "✅ Permission BILLING ajoutée"
          else
            echo "Permission BILLING déjà présente ou manifeste introuvable"
          fi

      - name: Inject AD_ID permission into manifest
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          echo "=== Manifeste avant ==="
          cat "$MANIFEST"
          # Ajouter la permission AD_ID si absente (déclaration Play Console : l'app utilise un identifiant publicitaire)
          if ! grep -q "com.google.android.gms.permission.AD_ID" "$MANIFEST"; then
            sed -i 's#<application#<uses-permission android:name="com.google.android.gms.permission.AD_ID"/>\n\n    <application#' "$MANIFEST"
            echo "=== Permission AD_ID ajoutée ==="
          else
            echo "AD_ID déjà présente"
          fi
          echo "=== Manifeste après ==="
          cat "$MANIFEST"

      - name: Ajouter l'App ID AdMob au manifeste
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          # App ID AdMob DOSCO (compte pub-4842522718903700).
          # Peut être surchargé via le secret GitHub ADMOB_APP_ID si besoin
          # (ex: build de test avec un autre compte AdMob).
          ADMOB_APP_ID="${{ secrets.ADMOB_APP_ID }}"
          if [ -z "$ADMOB_APP_ID" ]; then
            ADMOB_APP_ID="ca-app-pub-4842522718903700~1951875872"
          fi
          if [ -f "$MANIFEST" ] && ! grep -q "com.google.android.gms.ads.APPLICATION_ID" "$MANIFEST"; then
            sed -i "s#</application>#    <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"${ADMOB_APP_ID}\"/>\n    </application>#" "$MANIFEST"
            echo "✅ Meta-data AdMob APPLICATION_ID ajoutée ($ADMOB_APP_ID)"
          else
            echo "Meta-data AdMob déjà présente ou manifeste introuvable"
          fi

      - name: Inject DOSCO icons (Sirus + Rigel)
        run: |
          if [ -d android-res ]; then
            for dens in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              if [ -d "android-res/mipmap-$dens" ]; then
                mkdir -p "android/app/src/main/res/mipmap-$dens"
                cp android-res/mipmap-$dens/*.png "android/app/src/main/res/mipmap-$dens/" 2>/dev/null || true
              fi
            done
            echo "✅ Icônes DOSCO copiées dans le projet Android"
          else
            echo "⚠️ dossier android-res introuvable"
          fi

      - name: Force API 36 (targetSdk / compileSdk)
        run: |
          VARS=android/variables.gradle
          if [ -f "$VARS" ]; then
            echo "=== variables.gradle avant ==="
            cat "$VARS"
            sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 36/' "$VARS"
            sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 36/' "$VARS"
            echo "=== variables.gradle après ==="
            cat "$VARS"
            echo "✅ API 36 forcée dans variables.gradle"
          else
            echo "⚠️ variables.gradle introuvable"
          fi

      - name: Force API 36 in app/build.gradle (si valeurs en dur)
        run: |
          GRADLE=android/app/build.gradle
          if [ -f "$GRADLE" ]; then
            echo "=== build.gradle avant (SDK) ==="
            grep -E "compileSdk|targetSdk" "$GRADLE" || echo "(valeurs héritées de variables.gradle)"
            # Ne modifie que si les valeurs sont écrites en dur (nombre après le mot-clé)
            sed -i 's/compileSdk \+[0-9]\+/compileSdk 36/' "$GRADLE"
            sed -i 's/compileSdkVersion \+[0-9]\+/compileSdkVersion 36/' "$GRADLE"
            sed -i 's/targetSdk \+[0-9]\+/targetSdk 36/' "$GRADLE"
            sed -i 's/targetSdkVersion \+[0-9]\+/targetSdkVersion 36/' "$GRADLE"
            echo "=== build.gradle après (SDK) ==="
            grep -E "compileSdk|targetSdk" "$GRADLE" || echo "(valeurs héritées de variables.gradle)"
          else
            echo "⚠️ build.gradle introuvable"
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set app version (versionCode + versionName)
        run: |
          GRADLE=android/app/build.gradle
          # versionCode croissant : on part de 1 (déjà utilisé) + numéro de run GitHub
          # -> garantit un code unique et toujours plus grand à chaque build
          VCODE=$(( 1 + ${{ github.run_number }} ))
          VNAME="1.0.${{ github.run_number }}"
          echo "versionCode cible : $VCODE"
          echo "versionName cible : $VNAME"
          if [ -f "$GRADLE" ]; then
            sed -i "s/versionCode [0-9]\+/versionCode $VCODE/" "$GRADLE"
            sed -i "s/versionName \"[^\"]*\"/versionName \"$VNAME\"/" "$GRADLE"
            echo "=== defaultConfig après modification ==="
            grep -E "versionCode|versionName" "$GRADLE" || true
            echo "✅ Version appliquée (code=$VCODE, name=$VNAME)"
          else
            echo "⚠️ build.gradle introuvable"
          fi

      - name: Vérifier le niveau d'API effectif
        run: |
          echo "=== variables.gradle ==="
          cat android/variables.gradle || true
          echo "=== app/build.gradle (extrait SDK/version) ==="
          grep -E "compileSdk|targetSdk|minSdk|versionCode|versionName" android/app/build.gradle || true

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Build AAB
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Restore or create signing keystore
        run: |
          set -e
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            # Réutiliser la clé PERMANENTE stockée dans les secrets GitHub
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > k.jks
            echo "✅ Keystore permanent restauré depuis les secrets"
          else
            # Aucun secret défini : générer une clé (À FAIRE UNE SEULE FOIS, puis la sauvegarder)
            echo "⚠️ Aucun KEYSTORE_BASE64 dans les secrets — génération d'une clé temporaire"
            keytool -genkeypair \
              -keystore k.jks \
              -alias "${{ secrets.KEY_ALIAS }}" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
              -keypass "${{ secrets.KEY_PASSWORD }}" \
              -dname "CN=DOSCO,O=DOSCO,C=CM" \
              -storetype JKS -noprompt
          fi
          # Afficher l'empreinte SHA1 pour vérification (doit correspondre à Google Play)
          keytool -list -v -keystore k.jks \
            -alias "${{ secrets.KEY_ALIAS }}" \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" 2>/dev/null | grep "SHA1:" || true

      - name: Sign packages
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e
          BT=$(ls -d ${ANDROID_HOME}/build-tools/*/ | sort -V | tail -1)

          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          AAB=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -1)

          ${BT}zipalign -f -v -p 4 "$APK" aligned.apk

          ${BT}apksigner sign \
            --ks k.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass pass:"$KS_PASS" \
            --key-pass pass:"$KEY_PASS" \
            --out dosco.apk \
            aligned.apk

          ${BT}apksigner verify dosco.apk

          jarsigner -keystore k.jks -storepass "$KS_PASS" -keypass "$KEY_PASS" "$AAB" "$KEY_ALIAS"

          cp "$AAB" dosco.aab

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DOSCO-APK
          path: dosco.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: DOSCO-AAB
          path: dosco.aab

      - name: Upload KEYSTORE
        uses: actions/upload-artifact@v4
        with:
          name: SAVE-KEYSTORE
          path: k.jks

      - name: Upload R8 mapping.txt (déobfuscation des crashs)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R8-MAPPING
          path: android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
